apiVersion: batch/v1
kind: Job
metadata:
  name: redis-producer
  namespace: worker-scaler
spec:
  ttlSecondsAfterFinished: 10
  template:
    metadata:
      labels:
        app: redis-producer
    spec:
      containers:
        - name: producer
          image: docker.io/alesr/redis-producer:v1
          imagePullPolicy: Always
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: PRODUCER_DELAY
              value: "100ms"
      restartPolicy: Never
  backoffLimit: 2
